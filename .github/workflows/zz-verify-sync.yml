# Atelier: throwaway check of an upstream sync branch (verify/** is never merged).
# Runs the repository's gate and writes failures as job annotations, which can be read through
# the REST API (job logs can't be fetched by the sync agent).
name: zz-verify-sync
on:
  push:
    branches: ["verify/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zz-verify-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      # As upstream's gate (craft-common-actions gate.yml): tests build with the suite's craft-fonts
      # pin and require it, so the Japanese-glyph tests run instead of failing.
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: bfcbf714e45a3ea8e98f88ab2b7971372a576414
          path: craft-fonts
          persist-credentials: false
      - name: Build with craft-fonts
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h /
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Write the failure reporter
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'SH'
          #!/usr/bin/env bash
          # report.sh <step> <log>: failing tests, panics and errors as annotations.
          set +e
          step="$1"; log="$2"
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$log" > "$log.plain"
          grep -E "^test .* FAILED$" "$log.plain" | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u | head -40 | while read -r name; do
            echo "::error title=$step failing test::${name}"
          done
          grep -E "^error: test failed, to rerun pass" "$log.plain" | sort -u | head -20 | while read -r line; do
            echo "::error title=$step failing target::${line:0:300}"
          done
          grep -E "panicked at|^error(\[E[0-9]+\])?:|^warning: unused|No space left|SIGKILL|signal: |FAIL " "$log.plain" | grep -v "^error: test failed" | sort -u | head -25 | while read -r line; do
            echo "::error title=$step output::${line:0:900}"
          done
          grep -A12 -E "^---- .* stdout ----" "$log.plain" | head -150 | tr '\n' ' ' | fold -w 900 | head -8 | while read -r chunk; do
            echo "::error title=$step test stdout::${chunk}"
          done
          echo "::error title=$step log tail::$(tail -c 1800 "$log.plain" | tr '\n' ' ' | cut -c1-1700)"
          SH
          chmod +x "$RUNNER_TEMP/report.sh"
      - name: test (baseline, the test that failed on the sync)
        run: |
          set -o pipefail
          for i in 1 2 3; do
            cargo test -p effectcraft-ui-egui --lib --release -- viewer_frames 2>&1 | tee test-$i.log || "$RUNNER_TEMP/report.sh" "baseline run $i" test-$i.log
          done
          ! grep -q 'FAILED$' test-*.log
